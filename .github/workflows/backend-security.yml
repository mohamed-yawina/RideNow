name: Backend Security Tests

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-security.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile backend Python sources
        run: python -m compileall -q -x '(/venv/|/\.venv/|/__pycache__/)' .

      - name: Run JWT and password regression tests
        env:
          SECRET_KEY: ci-only-ridenow-random-looking-test-key-not-for-production-123456
        run: python -m unittest discover -s tests -v
